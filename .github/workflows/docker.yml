# Builds the website image and pushes it to GitHub's registry (GHCR) on every
# push to develop:
#
#   ghcr.io/sovannthai/e-invitation-wedding:develop        ← what the server pulls
#   ghcr.io/sovannthai/e-invitation-wedding:sha-<commit>   ← for rolling back
#
# Nothing is deployed from here; on the server run
#   docker compose pull && docker compose up -d
# (see api-e-wedding/deploy).
name: Docker image

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cases the repository name, which GHCR requires
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
