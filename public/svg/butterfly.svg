<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 -80 220 170" role="img" aria-label="Pale sage butterfly with gold-edged wings">
  <defs>
    <linearGradient id="wingUp" x1="10%" y1="90%" x2="85%" y2="10%">
      <stop offset="0%"   stop-color="#B9C9B2"/>
      <stop offset="42%"  stop-color="#DCE4D5"/>
      <stop offset="78%"  stop-color="#F1EFE4"/>
      <stop offset="100%" stop-color="#EFE7D2"/>
    </linearGradient>
    <linearGradient id="wingLow" x1="15%" y1="10%" x2="80%" y2="95%">
      <stop offset="0%"   stop-color="#C6D3BE"/>
      <stop offset="55%"  stop-color="#E7EBE0"/>
      <stop offset="100%" stop-color="#F2EFE3"/>
    </linearGradient>
    <linearGradient id="edgeGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8A6C2E" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#A8873F" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#7C5F27"/>
    </linearGradient>
  </defs>

  <g id="bf-half">
    <path d="M 0,-16 C 13,-40 40,-56 62,-49 C 79,-43 81,-20 72,-1 C 64,15 30,15 2,7 Z" fill="url(#wingUp)"  stroke="#9DA893" stroke-width="0.7"/>
    <path d="M 2,10 C 26,12 52,22 57,40 C 62,58 43,70 24,63 C 10,58 3,40 1,26 Z" fill="url(#wingLow)" stroke="#9DA893" stroke-width="0.7"/>
    <!-- gold band along the leading edge + wingtip -->
    <path d="M 0,-16 C 13,-40 40,-56 62,-49 C 79,-43 81,-20 72,-1"
          fill="none" stroke="url(#edgeGold)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 57,40 C 62,58 43,70 24,63"
          fill="none" stroke="url(#edgeGold)" stroke-width="4" stroke-linecap="round" opacity=".75"/>
    <g fill="none" stroke="#A3AE99" stroke-width="0.65" opacity=".8" stroke-linecap="round">
      <path d="M 3,-13 C 20,-27 40,-38 60,-43"/>
      <path d="M 3,-9 C 22,-18 44,-25 68,-24"/>
      <path d="M 3,-4 C 24,-6 48,-6 71,-6"/>
      <path d="M 3,14 C 22,18 42,28 53,42"/>
      <path d="M 3,20 C 20,26 34,38 40,54"/>
    </g>
  </g>
  <use href="#bf-half" transform="scale(-1,1)"/>

  <!-- body, head, antennae -->
  <path d="M -3.4,-22 C -6,-4 -6,26 -2.6,52 C -1,58 1,58 2.6,52 C 6,26 6,-4 3.4,-22 C 2,-27 -2,-27 -3.4,-22 Z" fill="#8E8D7C"/>
  <ellipse cx="0" cy="-24" rx="4.2" ry="4.6" fill="#7C7B6B"/>
  <g fill="none" stroke="#8E8D7C" stroke-width="1.5" stroke-linecap="round">
    <path d="M -2,-27 C -10,-42 -22,-52 -34,-56"/>
    <path d="M  2,-27 C 10,-42 22,-52 34,-56"/>
  </g>
  <circle cx="-34.5" cy="-56.5" r="2" fill="#8E8D7C"/>
  <circle cx="34.5"  cy="-56.5" r="2" fill="#8E8D7C"/>
</svg>
